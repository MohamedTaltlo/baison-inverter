name: BAISON W70 Experimental Firmware
on:
  push:
    branches: [experiment/w70-custom-firmware]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firmware:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            python
            coreutils
            file
      - name: Clone HiFlying SDK
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/freshev/BL602-UART-bridge.git sdk_upstream
          if ($LASTEXITCODE -ne 0) { throw 'Clone failed' }
      - name: Integrate BAISON read-only firmware
        shell: msys2 {0}
        run: |
          python3 firmware/w70/integrate.py
      - name: Compile customized BL602 image and HiFlying OTA
        shell: msys2 {0}
        run: |
          cd sdk_upstream
          export PROJECT_NAME=lpt570
          ls -l ./toolchain/bin/riscv64-unknown-elf-gcc.exe
          ./toolchain/bin/riscv64-unknown-elf-gcc.exe --version
          printf 'int w70_test(void){return 42;}\n' > test_compiler.c
          ./toolchain/bin/riscv64-unknown-elf-gcc.exe -c test_compiler.c -o test_compiler.o -march=rv32imafc -mabi=ilp32f
          make -j1 V=1
          file out/lpt570.bin
          ./tools/IMG_Tools.exe out/lpt570.bin ./out/lpt570-upgrade.bin ./tools/lzma.exe "HF-LPx70x1 Image" --version3
          python3 lpx70_upgrade.py ./out/lpt570-upgrade.bin
          ls -lah out/lpt570*.bin
          cp out/lpt570-upgrade.bin ../BAISON_W70_Experimental_HiFlying_OTA.bin
      - uses: actions/upload-artifact@v4
        with:
          name: BAISON-W70-Experimental-OTA-BIN
          path: BAISON_W70_Experimental_HiFlying_OTA.bin
          if-no-files-found: error
