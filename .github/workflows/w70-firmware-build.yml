name: W70 Experimental Firmware Build
on:
  push:
    branches: [experiment/w70-custom-firmware]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firmware:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            python
            coreutils
            file
      - name: Clone HiFlying BL602 vendor SDK
        shell: msys2 {0}
        run: |
          git clone --depth 1 https://github.com/freshev/BL602-UART-bridge.git sdk_upstream
      - name: Build official HiFlying SDK example and OTA container
        shell: msys2 {0}
        run: |
          cd sdk_upstream
          export PROJECT_NAME=lpt570
          make -j2
          file out/lpt570.bin
          ./tools/IMG_Tools.exe out/lpt570.bin ./out/lpt570-upgrade.bin ./tools/lzma.exe "HF-LPx70x1 Image" --version3
          python3 lpx70_upgrade.py ./out/lpt570-upgrade.bin
          ls -lah out/lpt570*.bin
          cp out/lpt570-upgrade.bin ../W70_VENDOR_SDK_BASELINE_NOT_CUSTOM.bin
      - uses: actions/upload-artifact@v4
        with:
          name: W70-Vendor-SDK-Baseline-NOT-CUSTOM
          path: W70_VENDOR_SDK_BASELINE_NOT_CUSTOM.bin
          if-no-files-found: error
