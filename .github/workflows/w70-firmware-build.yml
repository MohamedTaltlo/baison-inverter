name: BAISON W70 Experimental Firmware
on:
  push:
    branches: [experiment/w70-custom-firmware]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux RISC-V toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends make python3 gcc-riscv64-unknown-elf binutils-riscv64-unknown-elf picolibc-riscv64-unknown-elf
      - name: Clone HiFlying SDK
        run: |
          git clone --depth 1 https://github.com/freshev/BL602-UART-bridge.git sdk_upstream
      - name: Integrate BAISON read-only firmware
        run: |
          python3 firmware/w70/integrate.py
      - name: Compile customized BL602 image
        shell: bash
        run: |
          set -euxo pipefail
          cd sdk_upstream
          export PROJECT_NAME=lpt570
          export CPATH="$PWD/toolchain/riscv64-unknown-elf/include"
          export LIBRARY_PATH="$PWD/toolchain/riscv64-unknown-elf/lib/rv32imfc/ilp32f:$PWD/toolchain/lib/gcc/riscv64-unknown-elf/10.2.0/rv32imfc/ilp32f"
          for cmd in gcc ar as ld objcopy objdump nm ranlib readelf size strip; do
            target="/usr/bin/riscv64-unknown-elf-$cmd"
            if [ -x "$target" ]; then
              ln -sf "$target" "./toolchain/bin/riscv64-unknown-elf-$cmd"
            fi
          done
          ./toolchain/bin/riscv64-unknown-elf-gcc -v
          make -j2 V=1 EXTRA_LDFLAGS="-Wl,--cref -nostartfiles -L${PWD}/toolchain/riscv64-unknown-elf/lib/rv32imfc/ilp32f -L${PWD}/toolchain/lib/gcc/riscv64-unknown-elf/10.2.0/rv32imfc/ilp32f"
          test -s out/lpt570.bin
          python3 ../firmware/w70/patch_runtime_magic.py out/lpt570.bin
          ./toolchain/bin/riscv64-unknown-elf-nm out/lpt570.elf | grep -E "baison_recovery_start|baison_at_ota|baison_local_read|baison_receive|baison_at_write|hfupdate_complete"
          ./toolchain/bin/riscv64-unknown-elf-nm out/lpt570.elf | grep -q "hfupdate_complete"
          ./toolchain/bin/riscv64-unknown-elf-nm out/lpt570.elf | grep -q "baison_recovery_start"
          ./toolchain/bin/riscv64-unknown-elf-nm out/lpt570.elf | grep -q "baison_local_read"
          file out/lpt570.bin
          chmod +x tools/IMG_Tools tools/lzma
          ./tools/IMG_Tools out/lpt570.bin ./out/lpt570-upgrade.bin ./tools/lzma "EPORT-PW41 Image" --version3
          python3 ../firmware/w70/package_ota.py out/lpt570-upgrade.bin ../BAISON_W70_V11_OTA_EXPERIMENTAL.bin
      - uses: actions/upload-artifact@v4
        with:
          name: BAISON-W70-V11-OTA-Experimental-Factory-Envelope
          path: BAISON_W70_V11_OTA_EXPERIMENTAL.bin
          if-no-files-found: error
