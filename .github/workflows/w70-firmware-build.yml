name: W70 Experimental Firmware Build
on:
  push:
    branches:
      - experiment/w70-custom-firmware
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends make python3 xz-utils libstdc++6 file
      - name: Clone HiFlying BL602 SDK example
        run: |
          git clone --depth 1 https://github.com/freshev/BL602-UART-bridge.git sdk_upstream
          chmod +x sdk_upstream/tools/IMG_Tools sdk_upstream/tools/lzma || true
          find sdk_upstream/toolchain -type f -name '*gcc' -exec chmod +x {} \;
      - name: Build baseline and HiFlying OTA container
        shell: bash
        run: |
          cd sdk_upstream
          export PROJECT_NAME=lpt570
          make -j2
          file out/lpt570.bin
          ./tools/IMG_Tools out/lpt570.bin out/lpt570-upgrade.bin ./tools/lzma "HF-LPx70x1 Image" --version3
          python3 lpx70_upgrade.py out/lpt570-upgrade.bin
          ls -lah out/lpt570*.bin
          cp out/lpt570-upgrade.bin ../BAISON_W70_BASELINE_NOT_CUSTOM.bin
      - name: Artifact
        uses: actions/upload-artifact@v4
        with:
          name: W70-Baseline-Compile-Proof
          path: BAISON_W70_BASELINE_NOT_CUSTOM.bin
          if-no-files-found: error
